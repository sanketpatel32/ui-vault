<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="UI Vault — a personal, categorized catalog of UI components from 33 free, vendorable sources, with live previews and install commands."
    />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UI Vault" />
    <meta property="og:title" content="UI Vault" />
    <meta
      property="og:description"
      content="A personal, categorized catalog of UI components with live previews and install commands."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="UI Vault" />
    <meta
      name="twitter:description"
      content="A personal, categorized catalog of UI components with live previews and install commands."
    />
    <title>UI Vault</title>
    <script>
      try {
        var t = localStorage.getItem("ui-vault:theme");
        if (t === "light") document.documentElement.classList.remove("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif">
        UI Vault needs JavaScript — it is a client-only catalog.
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
